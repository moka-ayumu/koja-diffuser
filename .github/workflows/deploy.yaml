name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: ./frontend
        run: pnpm build

      - name: Build Server
        working-directory: ./frontend
        run: pnpm build:server

      - name: Default group to CPU
        run: |
          sed -i 's/default-groups = \["cu130"\]/default-groups = ["cpu"]/g' pyproject.toml

      - name: Prepare Hugging Face Space files
        run: |
          set -euo pipefail

          rm -rf hf_deploy
          mkdir -p hf_deploy hf_deploy/koja_diffuser hf_deploy/frontend

          cp space-README.md hf_deploy/README.md
          cp .python-version Dockerfile pyproject.toml uv.lock hf_deploy/
          cp -r koja_diffuser/* hf_deploy/koja_diffuser/
          cp -r frontend/build/* hf_deploy/frontend/

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: MOKA-AYUMU
          HF_SPACE: KoJaDiffuser
        run: |
          set -euo pipefail

          cd hf_deploy

          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "Sync from GitHub ${GITHUB_SHA}"

          git branch -M main
          git push --force https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE} main
